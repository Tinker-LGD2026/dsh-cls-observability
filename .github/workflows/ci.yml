name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Session recordings of each supported DeepSeek Harness release.
        dsh: [dsh-v0.2.2-rc.1]
    steps:
      - uses: actions/checkout@v4

      - name: DeepSeek Harness recordings (${{ matrix.dsh }})
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ matrix.dsh }}
          path: deepseek-harness
          sparse-checkout: snapshots

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - name: Unit, contract and fault-injection tests
        run: npm test
        env:
          DSH_REPO: ${{ github.workspace }}/deepseek-harness
      - run: npm run build
      - name: The bundle loads and has no runtime dependencies
        run: |
          node -e "import('./dist/dsh-cls-observability.mjs').then((m) => { if (typeof m.apply !== 'function') process.exit(1) })"
          CLS_AGENTOBS_ENABLED=false node dist/dsh-cls-observability.mjs --selftest; test $? -eq 1
